mcs.metadata:
  componentName: Main
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - feeds 3

  actions:
    - kind: SetVariable
      id: set_cutoff
      variable: Topic.Cutoff
      value: =Text(DateAdd(Now(), -1, TimeUnit.Days), "yyyy-mm-dd hh:mm")

    - kind: SendActivity
      id: dbg_cutoff
      activity: "CUTOFF: {Topic.Cutoff}"

    - kind: HttpRequestAction
      id: http_g1a
      url: https://www.stheadline.com/rss
      response: Topic.g1a
      responseSchema: String

    - kind: HttpRequestAction
      id: http_g1b
      url: https://www.i-cable.com/rss
      response: Topic.g1b
      responseSchema: String

    - kind: HttpRequestAction
      id: http_g1c
      url: https://www.scmp.com/rss/91/feed/
      response: Topic.g1c
      responseSchema: String

    - kind: SetVariable
      id: set_g1raw
      variable: Topic.G1Raw
      value: =Topic.g1a & Topic.g1b & Topic.g1c

    - kind: SendActivity
      id: dbg_p1
      activity: P1 START raw={Len(Topic.G1Raw)}

    - kind: InvokeAIBuilderModelAction
      id: parse_g1
      input:
        binding:
          cutoff: =Topic.Cutoff
          response: =Topic.G1Raw

      output:
        binding:
          predictionOutput: Topic.G1Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: SendActivity
      id: dbg_p1_text
      activity: "P1 TEXT: {Left(Topic.G1Parsed.text, 800)}"

    - kind: SendActivity
      id: dbg_p1_done
      activity: P1 OK parsed={Len(Topic.G1Parsed.text)}

    - kind: InvokeAIBuilderModelAction
      id: classify_g1
      input:
        binding:
          result: =Topic.G1Parsed.text

      output:
        binding:
          predictionOutput: Topic.C1

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: dbg_c1_done
      activity: "C1 OK: {Topic.C1.text}"

    - kind: HttpRequestAction
      id: http_g2a
      url: https://www.bastillepost.com/hongkong/feed
      response: Topic.g2a
      responseSchema: String

    - kind: HttpRequestAction
      id: http_g2b
      url: https://www.etnet.com.hk/www/tc/news/rss.php?section=editor&fid=538467
