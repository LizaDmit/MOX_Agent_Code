          LastN(
            Split(Topic.g4a4, "<description>"),
            CountRows(Split(Topic.g4a4, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: InvokeAIBuilderModelAction
      id: parse_g4a4
      input:
        binding:
          response: =Topic.g4a4slim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4a4Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: InvokeAIBuilderModelAction
      id: classify_g4a4
      input:
        binding:
          result: =Topic.G4a4Parsed.text

      output:
        binding:
          predictionOutput: Topic.C4a4

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: HttpRequestAction
      id: http_g4b
      url: https://news.google.com/rss/search?q=site%3Atvb.com%20OR%20site%3Awenweipo.com%20OR%20site%3Aam730.com.hk%20OR%20site%3Ahkcd.com.hk%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4b
      responseSchema: String

    - kind: SetVariable
      id: set_g4b_slim
      variable: Topic.g4bslim
      value: |-
        =First(Split(Topic.g4b, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4b, "<description>"),
            CountRows(Split(Topic.g4b, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: InvokeAIBuilderModelAction
      id: parse_g4b
      input:
        binding:
          response: =Topic.g4bslim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4bParsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: InvokeAIBuilderModelAction
      id: classify_g4b
      input:
        binding:
          result: =Topic.G4bParsed.text

      output:
        binding:
          predictionOutput: Topic.C4b

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: HttpRequestAction
      id: http_g4c
      url: https://news.google.com/rss/search?q=site%3Aaastocks.com%20OR%20site%3Anow.com%20OR%20site%3Aquamnet.com%20OR%20site%3Athestandard.com.hk%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4c
      responseSchema: String

    - kind: SetVariable
      id: set_g4c_slim
      variable: Topic.g4cslim
      value: |-
        =First(Split(Topic.g4c, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4c, "<description>"),
            CountRows(Split(Topic.g4c, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: InvokeAIBuilderModelAction
      id: parse_g4c
      input:
        binding:
          response: =Topic.g4cslim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4cParsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: InvokeAIBuilderModelAction
      id: classify_g4c
      input:
        binding:
          result: =Topic.G4cParsed.text

      output:
        binding:
          predictionOutput: Topic.C4c

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: hb_3
      activity: Reading international outlets.

    - kind: HttpRequestAction
      id: http_g4d1
      url: https://news.google.com/rss/search?q=site%3Areuters.com%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4d1
      responseSchema: String

    - kind: SetVariable
      id: set_g4d1_slim
      variable: Topic.g4d1slim
      value: |-
        =First(Split(Topic.g4d1, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4d1, "<description>"),
            CountRows(Split(Topic.g4d1, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: InvokeAIBuilderModelAction
      id: parse_g4d1
      input:
        binding:
          response: =Topic.g4d1slim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4d1Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: InvokeAIBuilderModelAction
      id: classify_g4d1
      input:
        binding:
          result: =Topic.G4d1Parsed.text

      output:
        binding:
          predictionOutput: Topic.C4d1

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: HttpRequestAction
      id: http_g4d2
      url: https://news.google.com/rss/search?q=site%3Awsj.com%20OR%20site%3Ahket.com%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4d2
      responseSchema: String

    - kind: SetVariable
      id: set_g4d2_slim
      variable: Topic.g4d2slim
      value: |-
        =First(Split(Topic.g4d2, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4d2, "<description>"),
            CountRows(Split(Topic.g4d2, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: InvokeAIBuilderModelAction
      id: parse_g4d2
      input:
        binding:
          response: =Topic.g4d2slim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4d2Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: InvokeAIBuilderModelAction
      id: classify_g4d2
      input:
        binding:
          result: =Topic.G4d2Parsed.text

      output:
        binding:
          predictionOutput: Topic.C4d2

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: hb_4
      activity: Applying the time window and sorting results.

    - kind: SetVariable
      id: set_shortlist_raw
      variable: Topic.ShortlistRaw
      value: |-
        =Topic.C1.text & Char(10) &
        Topic.C2.text & Char(10) &
        Topic.C3.text & Char(10) &
        Topic.C4a1.text & Char(10) &
        Topic.C4a2.text & Char(10) &
        Topic.C4a4.text & Char(10) &
        Topic.C4b.text & Char(10) &
        Topic.C4c.text & Char(10) &
        Topic.C4d1.text & Char(10) &
        Topic.C4d2.text

    - kind: SetVariable
      id: set_shortlist_prewindow
      variable: Topic.ShortlistPreWindow
      value: |-
        =Concat(
          Filter(
            Split(Topic.ShortlistRaw, Char(10)),
            !StartsWith(Value, "DROP") And !IsBlank(Value)
          ),
          Value,
          Char(10)
        )

    - kind: SetVariable
      id: set_shortlist
      variable: Topic.Shortlist
      value: |-
        =Concat(
          Filter(
            Split(Topic.ShortlistPreWindow, Char(10)),
            IfError(
              CountRows(Split(ThisRecord.Value, "|")) >= 5
              And Value(
                    Substitute(
                      Substitute(
                        Substitute(
                          Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value),
                          "-", ""),
                        ":", ""),
                      " ", "")
                  ) >= Topic.WindowStartNum
              And Value(
                    Substitute(
                      Substitute(
                        Substitute(
                          Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value),
                          "-", ""),
                        ":", ""),
                      " ", "")
                  ) < Topic.WindowEndNum,
              false
            )
          ),
          Value,
          Char(10)
        )

    - kind: InvokeAIBuilderModelAction
      id: sort_all
      input:
        binding:
          Input: =Topic.Shortlist

      output:
        binding:
          predictionOutput: Topic.Sorted

      aIModelId: 8429492a-ed4c-498f-a53e-9315f15949da

    - kind: SendActivity
      id: send_result
      activity: "{Topic.Sorted.text}"

inputType: {}
outputType: {}