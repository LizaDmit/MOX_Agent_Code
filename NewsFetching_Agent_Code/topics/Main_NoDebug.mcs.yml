mcs.metadata:
  componentName: Main_NoDebug
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - mox news

  actions:
    - kind: SetVariable
      id: set_window_end
      variable: Topic.WindowEnd
      value: =Text(DateAdd(Today(), 570, TimeUnit.Minutes), "yyyy-mm-dd hh:mm")

    - kind: SetVariable
      id: set_window_start
      variable: Topic.WindowStart
      value: |-
        =Text(
          DateAdd(
            DateAdd(Today(), 570, TimeUnit.Minutes),
            If(Weekday(Today()) = 2, -3, -1),
            TimeUnit.Days
          ),
          "yyyy-mm-dd hh:mm"
        )

    - kind: SetVariable
      id: set_window_start_num
      variable: Topic.WindowStartNum
      value: =Value(Substitute(Substitute(Substitute(Topic.WindowStart, "-", ""), ":", ""), " ", ""))

    - kind: SetVariable
      id: set_window_end_num
      variable: Topic.WindowEndNum
      value: =Value(Substitute(Substitute(Substitute(Topic.WindowEnd, "-", ""), ":", ""), " ", ""))

    - kind: SendActivity
      id: hb_1
      activity: Fetching Hong Kong news feeds. This takes a few minutes.

    - kind: HttpRequestAction
      id: http_g1a
      url: https://www.stheadline.com/rss
      response: Topic.g1a
      responseSchema: String

    - kind: SetVariable
      id: set_g1a_fx
      variable: Topic.G1aFx
      value: |-
        =IfError(
          Concat(
            ForAll(
              ForAll(
                ForAll(
                  LastN(
                    Split(Topic.g1a, "<item>"),
                    CountRows(Split(Topic.g1a, "<item>")) - 1
                  ),
                  {
                    t: Trim(Substitute(Substitute(First(Split(Last(Split(ThisRecord.Value, "<title>")).Value, "</title>")).Value, "<![CDATA[", ""), "]]>", "")),
                    l: Trim(Substitute(Substitute(First(Split(Last(Split(ThisRecord.Value, "<link>")).Value, "</link>")).Value, "<![CDATA[", ""), "]]>", "")),
                    p: Trim(Substitute(Substitute(First(Split(Last(Split(ThisRecord.Value, "<pubDate>")).Value, "</pubDate>")).Value, "<![CDATA[", ""), "]]>", ""))
                  }
                ),
                {
                  t: ThisRecord.t,
                  l: ThisRecord.l,
                  dt: If(
                        Find(",", ThisRecord.p) > 0,
                        DateAdd(
                          DateAdd(
                            DateAdd(
                              Date(
                                Value(Last(FirstN(Split(ThisRecord.p, " "), 4)).Value),
                                Switch(
                                  Last(FirstN(Split(ThisRecord.p, " "), 3)).Value,
                                  "Jan", 1, "Feb", 2, "Mar", 3, "Apr", 4, "May", 5, "Jun", 6,
                                  "Jul", 7, "Aug", 8, "Sep", 9, "Oct", 10, "Nov", 11, "Dec", 12,
                                  1
                                ),
                                Value(Last(FirstN(Split(ThisRecord.p, " "), 2)).Value)
                              ),
                              Value(First(Split(Last(FirstN(Split(ThisRecord.p, " "), 5)).Value, ":")).Value),
                              TimeUnit.Hours
                            ),
                            Value(Last(FirstN(Split(Last(FirstN(Split(ThisRecord.p, " "), 5)).Value, ":"), 2)).Value),
                            TimeUnit.Minutes
                          ),
                          If(Last(FirstN(Split(ThisRecord.p, " "), 6)).Value = "+0800", 0, 8),
                          TimeUnit.Hours
                        ),
                        DateAdd(
                          DateAdd(
                            DateAdd(
                              Date(Value(Left(ThisRecord.p, 4)), Value(Mid(ThisRecord.p, 6, 2)), Value(Mid(ThisRecord.p, 9, 2))),
                              Value(Mid(ThisRecord.p, 12, 2)),
                              TimeUnit.Hours
                            ),
                            Value(Mid(ThisRecord.p, 15, 2)),
                            TimeUnit.Minutes
                          ),
                          If(Mid(ThisRecord.p, 21, 2) = "08", 0, 8),
                          TimeUnit.Hours
                        )
                      )
                }
              ),
              If(
                !StartsWith(ThisRecord.l, "http"),
                "",
                Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(
                  ThisRecord.t,
                  "|", "-"),
                  "&quot;", """"),
                  "&#39;", "'"),
                  "&#039;", "'"),
                  "&#8217;", "'"),
                  "&#8216;", "'"),
                  "&#8220;", """"),
                  "&#8221;", """"),
                  "&lt;", "<"),
                  "&gt;", ">"),
                  "&amp;", "&")
                & " | " & "Sing Tao Daily"
                & " | " & Text(ThisRecord.dt, "yyyy-mm-dd hh:mm")
                & " | " & ThisRecord.l
              )
            ),
            Value,
            Char(10)
          ),
          "FXERROR"
        )

