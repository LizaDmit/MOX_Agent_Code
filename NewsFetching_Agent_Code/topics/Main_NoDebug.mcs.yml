        binding:
          predictionOutput: Topic.C4a2

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: HttpRequestAction
      id: http_g4a4
      url: https://news.google.com/rss/search?q=site%3Arthk.hk%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4a4
      responseSchema: String

    - kind: SetVariable
      id: set_g4a4_slim
      variable: Topic.g4a4slim
      value: |-
        =First(Split(Topic.g4a4, "<description>")).Value &
