      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: SendActivity
      id: dbg_p4c_done
      activity: P4C OK in={CountRows(Split(Topic.g4cslim, "<item>")) - 1} out={CountRows(Split(Topic.G4cParsed.text, Char(10)))} chars={Len(Topic.G4cParsed.text)}

    - kind: InvokeAIBuilderModelAction
      id: classify_g4c
      input:
        binding:
          result: =Topic.G4cParsed.text

      output:
        binding:
          predictionOutput: Topic.C4c

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: dbg_c4c_done
      activity: "C4C OK: {Topic.C4c.text}"

    - kind: HttpRequestAction
      id: http_g4d1
      url: https://news.google.com/rss/search?q=site%3Areuters.com%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4d1
      responseSchema: String

    - kind: SetVariable
      id: set_g4d1_slim
      variable: Topic.g4d1slim
      value: |-
        =First(Split(Topic.g4d1, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4d1, "<description>"),
            CountRows(Split(Topic.g4d1, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: SetVariable
      id: set_g4d1_fx
      variable: Topic.G4d1Fx
      value: |-
        =IfError(
          Concat(
            ForAll(
              ForAll(
                ForAll(
                  LastN(
                    Split(Topic.g4d1slim, "<item>"),
                    CountRows(Split(Topic.g4d1slim, "<item>")) - 1
                  ),
                  {
                    t: First(Split(Last(Split(ThisRecord.Value, "<title>")).Value, "</title>")).Value,
                    l: First(Split(Last(Split(ThisRecord.Value, "<link>")).Value, "</link>")).Value,
                    p: Trim(First(Split(Last(Split(ThisRecord.Value, "<pubDate>")).Value, "</pubDate>")).Value),
                    s: First(Split(Last(FirstN(Split(Last(Split(ThisRecord.Value, "<source")).Value, ">"), 2)).Value, "</source")).Value
                  }
                ),
                {
                  t: ThisRecord.t,
                  l: ThisRecord.l,
                  s: ThisRecord.s,
                  dt: DateAdd(
                        DateAdd(
                          DateAdd(
                            Date(
                              Value(Last(FirstN(Split(ThisRecord.p, " "), 4)).Value),
                              Switch(
                                Last(FirstN(Split(ThisRecord.p, " "), 3)).Value,
                                "Jan", 1, "Feb", 2, "Mar", 3, "Apr", 4, "May", 5, "Jun", 6,
                                "Jul", 7, "Aug", 8, "Sep", 9, "Oct", 10, "Nov", 11, "Dec", 12,
                                1
                              ),
                              Value(Last(FirstN(Split(ThisRecord.p, " "), 2)).Value)
                            ),
                            Value(First(Split(Last(FirstN(Split(ThisRecord.p, " "), 5)).Value, ":")).Value),
                            TimeUnit.Hours
                          ),
                          Value(Last(FirstN(Split(Last(FirstN(Split(ThisRecord.p, " "), 5)).Value, ":"), 2)).Value),
                          TimeUnit.Minutes
                        ),
                        If(Last(FirstN(Split(ThisRecord.p, " "), 6)).Value = "+0800", 0, 8),
                        TimeUnit.Hours
                      )
                }
              ),
              Substitute(
                Substitute(
                  Substitute(
                    Substitute(
                      Substitute(
                        If(
                          EndsWith(ThisRecord.t, " - " & ThisRecord.s),
                          Left(ThisRecord.t, Len(ThisRecord.t) - Len(ThisRecord.s) - 3),
                          ThisRecord.t
                        ),
                        "|", "-"),
                      "&quot;", """"),
                    "&#39;", "'"),
                  "&lt;", "<"),
                "&amp;", "&")
              & " | " & ThisRecord.s
              & " | " & Text(ThisRecord.dt, "yyyy-mm-dd hh:mm")
              & " | " & ThisRecord.l
            ),
            Value,
            Char(10)
          ),
          "FXERROR"
        )

    - kind: SendActivity
      id: dbg_p4d1
      activity: P4D1 START raw={Len(Topic.g4d1)} slim={Len(Topic.g4d1slim)}

    - kind: InvokeAIBuilderModelAction
      id: parse_g4d1
      input:
        binding:
          response: =Topic.g4d1slim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4d1Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: SendActivity
      id: dbg_p4d1_fx
      activity: P4D1 FX lines={CountRows(Split(Topic.G4d1Fx, Char(10)))} chars={Len(Topic.G4d1Fx)}

    - kind: SendActivity
      id: dbg_p4d1_fx_head
      activity: "P4D1 FX OUT: {Left(Topic.G4d1Fx, 3500)}"

    - kind: SendActivity
      id: dbg_p4d1_llm_head
      activity: "P4D1 LLM OUT: {Left(Topic.G4d1Parsed.text, 3500)}"

    - kind: SendActivity
      id: dbg_p4d1_done
      activity: P4D1 OK in={CountRows(Split(Topic.g4d1slim, "<item>")) - 1} out={CountRows(Split(Topic.G4d1Parsed.text, Char(10)))} chars={Len(Topic.G4d1Parsed.text)}

    - kind: InvokeAIBuilderModelAction
      id: classify_g4d1
      input:
        binding:
          result: =Topic.G4d1Parsed.text

      output:
        binding:
          predictionOutput: Topic.C4d1

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: dbg_c4d1_done
      activity: "C4D1 OK: {Topic.C4d1.text}"

    - kind: HttpRequestAction
      id: http_g4d2
      url: https://news.google.com/rss/search?q=site%3Awsj.com%20OR%20site%3Ahket.com%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4d2
      responseSchema: String

    - kind: SetVariable
      id: set_g4d2_slim
      variable: Topic.g4d2slim
      value: |-
        =First(Split(Topic.g4d2, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4d2, "<description>"),
            CountRows(Split(Topic.g4d2, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: SendActivity
      id: dbg_p4d2
      activity: P4D2 START raw={Len(Topic.g4d2)} slim={Len(Topic.g4d2slim)}

    - kind: InvokeAIBuilderModelAction
      id: parse_g4d2
      input:
        binding:
          response: =Topic.g4d2slim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4d2Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: SendActivity
      id: dbg_p4d2_done
      activity: P4D2 OK in={CountRows(Split(Topic.g4d2slim, "<item>")) - 1} out={CountRows(Split(Topic.G4d2Parsed.text, Char(10)))} chars={Len(Topic.G4d2Parsed.text)}

    - kind: InvokeAIBuilderModelAction
      id: classify_g4d2
      input:
        binding:
          result: =Topic.G4d2Parsed.text

      output:
        binding:
          predictionOutput: Topic.C4d2

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: dbg_c4d2_done
      activity: "C4D2 OK: {Topic.C4d2.text}"

    - kind: SetVariable
      id: set_shortlist_raw
      variable: Topic.ShortlistRaw
      value: |-
        =Topic.C1.text & Char(10) &
        Topic.C2.text & Char(10) &
        Topic.C3.text & Char(10) &
        Topic.C4a1.text & Char(10) &
        Topic.C4a2.text & Char(10) &
        Topic.C4a4.text & Char(10) &
        Topic.C4b.text & Char(10) &
        Topic.C4c.text & Char(10) &
        Topic.C4d1.text & Char(10) &
        Topic.C4d2.text

    - kind: SetVariable
      id: set_shortlist_prewindow
      variable: Topic.ShortlistPreWindow
      value: |-
        =Concat(
          Filter(
            Split(Topic.ShortlistRaw, Char(10)),
            !StartsWith(Value, "DROP") And !IsBlank(Value)
          ),
          Value,
          Char(10)
        )

    - kind: SendActivity
      id: dbg_prewindow
      activity: "PRE-WINDOW LEN: {Len(Topic.ShortlistPreWindow)}"

    - kind: SetVariable
      id: set_datesfound
      variable: Topic.DatesFound
      value: |-
        =Concat(
          ForAll(
            Filter(
              Split(Topic.ShortlistPreWindow, Char(10)),
              CountRows(Split(ThisRecord.Value, "|")) >= 5
            ),
            Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value)
          ),
          Value,
          " / "
        )

    - kind: SendActivity
      id: dbg_datesfound
      activity: "DATES: {Topic.DatesFound}"

    - kind: SetVariable
      id: set_shortlist
      variable: Topic.Shortlist
      value: |-
        =Concat(
          Filter(
            Split(Topic.ShortlistPreWindow, Char(10)),
            IfError(
              CountRows(Split(ThisRecord.Value, "|")) >= 5
              And Value(
                    Substitute(
                      Substitute(
                        Substitute(
                          Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value),
                          "-", ""),
                        ":", ""),
                      " ", "")
                  ) >= Topic.WindowStartNum
              And Value(
                    Substitute(
                      Substitute(
                        Substitute(
                          Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value),
                          "-", ""),
                        ":", ""),
                      " ", "")
                  ) < Topic.WindowEndNum,
              false
            )
          ),
          Value,
          Char(10)
        )

    - kind: SendActivity
      id: debug_shortlist
      activity: "POST-WINDOW LEN: {Len(Topic.Shortlist)}"

    - kind: InvokeAIBuilderModelAction
      id: sort_all
      input:
        binding:
          Input: =Topic.Shortlist

      output:
        binding:
          predictionOutput: Topic.Sorted

      aIModelId: 8429492a-ed4c-498f-a53e-9315f15949da

    - kind: SendActivity
      id: send_result
      activity: "{Topic.Sorted.text}"

inputType: {}
outputType: {}