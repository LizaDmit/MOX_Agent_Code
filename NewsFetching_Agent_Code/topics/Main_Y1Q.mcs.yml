                    Substitute(
                      Substitute(
                        Substitute(
                          Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value),
                          "-", ""),
                        ":", ""),
                      " ", "")
                  ) < Topic.WindowEndNum,
