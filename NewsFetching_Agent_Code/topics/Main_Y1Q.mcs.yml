mcs.metadata:
  componentName: Main
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - feeds 3

  actions:
    - kind: SetVariable
      id: set_window_end
      variable: Topic.WindowEnd
      value: =Text(DateAdd(Today(), 570, TimeUnit.Minutes), "yyyy-mm-dd hh:mm")

    - kind: SetVariable
      id: set_window_start
      variable: Topic.WindowStart
      value: |-
        =Text(
          DateAdd(
            DateAdd(Today(), 570, TimeUnit.Minutes),
            If(Weekday(Today()) = 2, -3, -1),
            TimeUnit.Days
          ),
          "yyyy-mm-dd hh:mm"
        )

    - kind: SetVariable
      id: set_window_start_num
      variable: Topic.WindowStartNum
      value: =Value(Substitute(Substitute(Substitute(Topic.WindowStart, "-", ""), ":", ""), " ", ""))

    - kind: SetVariable
      id: set_window_end_num
      variable: Topic.WindowEndNum
      value: =Value(Substitute(Substitute(Substitute(Topic.WindowEnd, "-", ""), ":", ""), " ", ""))

    - kind: SendActivity
      id: dbg_window
      activity: "WINDOW: {Topic.WindowStart} to {Topic.WindowEnd} | NUM: {Topic.WindowStartNum} to {Topic.WindowEndNum}"

    - kind: SendActivity
      id: dbg_runstart
      activity: RUN START {IfError(Text(Now(), "yyyy-mm-dd hh:mm:ss"), "NA")}

    - kind: HttpRequestAction
      id: http_g1a
      url: https://www.stheadline.com/rss
      response: Topic.g1a
      responseSchema: String

