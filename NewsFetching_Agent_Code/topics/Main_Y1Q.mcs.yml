            Split(Topic.ShortlistPreWindow, Char(10)),
            IfError(
              CountRows(Split(ThisRecord.Value, "|")) >= 5
              And Value(
                    Substitute(
                      Substitute(
                        Substitute(
                          Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value),
                          "-", ""),
                        ":", ""),
                      " ", "")
                  ) >= Topic.WindowStartNum
              And Value(
                    Substitute(
                      Substitute(
                        Substitute(
                          Trim(Last(FirstN(Split(ThisRecord.Value, "|"), 4)).Value),
                          "-", ""),
                        ":", ""),
                      " ", "")
                  ) < Topic.WindowEndNum,
              false
            )
          ),
          Value,
          Char(10)
        )

    - kind: SendActivity
      id: debug_shortlist
      activity: "POST-WINDOW LEN: {Len(Topic.Shortlist)}"

    - kind: SetVariable
      id: set_promo_filtered
      variable: Topic.PromoFiltered
      value: |-
        =IfError(
          Concat(
            Filter(
              Split(Topic.Shortlist, Char(10)),
              !IsBlank(Trim(ThisRecord.Value))
              And (
                Find("Mox", ThisRecord.Value) > 0
                Or Find("MOX", ThisRecord.Value) > 0
                Or !(
                Find("優惠碼", ThisRecord.Value) > 0
                Or Find("折扣碼", ThisRecord.Value) > 0
                Or Find("/videos/", ThisRecord.Value) > 0
                Or Find("/video/", ThisRecord.Value) > 0
                )
              )
            ),
            Value,
            Char(10)
          ),
          Topic.Shortlist
        )

    - kind: SetVariable
      id: set_promo_removed
      variable: Topic.PromoRemoved
      value: |-
        =IfError(
          Concat(
            Filter(
              Split(Topic.Shortlist, Char(10)),
              !IsBlank(Trim(ThisRecord.Value))
              And !(Find("Mox", ThisRecord.Value) > 0 Or Find("MOX", ThisRecord.Value) > 0)
              And (
                Find("優惠碼", ThisRecord.Value) > 0
                Or Find("折扣碼", ThisRecord.Value) > 0
                Or Find("/videos/", ThisRecord.Value) > 0
                Or Find("/video/", ThisRecord.Value) > 0
              )
            ),
            Value,
            Char(10)
          ),
          ""
        )

    - kind: SendActivity
      id: dbg_promo
      activity: "PROMO REMOVED: {Topic.PromoRemoved}"

    - kind: InvokeAIBuilderModelAction
      id: sort_all
      input:
        binding:
          Input: =Topic.PromoFiltered

      output:
        binding:
          predictionOutput: Topic.Sorted

      aIModelId: 8429492a-ed4c-498f-a53e-9315f15949da

    - kind: SetVariable
      id: set_tier_guard
      variable: Topic.TierGuarded
      value: |-
        =IfError(
          Concat(
            ForAll(
              Filter(
                Split(Topic.Sorted.text, Char(10)),
                !IsBlank(Trim(Value))
              ),
              If(
                StartsWith(ThisRecord.Value, "MOX")
                And IsBlank(Find("Mox", Mid(ThisRecord.Value, 4)))
                And IsBlank(Find("MOX", Mid(ThisRecord.Value, 4)))
                And IsBlank(Find("mox.com", Mid(ThisRecord.Value, 4))),
                "STAKEHOLDER" & Mid(ThisRecord.Value, 4),
                ThisRecord.Value
              )
            ),
            Value,
            Char(10)
          ),
          Topic.Sorted.text
        )

    - kind: SetVariable
      id: set_mox_demoted
      variable: Topic.MoxDemoted
      value: |-
        =IfError(
          Concat(
            Filter(
              Split(Topic.Sorted.text, Char(10)),
              StartsWith(Value, "MOX")
              And IsBlank(Find("Mox", Mid(Value, 4)))
              And IsBlank(Find("MOX", Mid(Value, 4)))
              And IsBlank(Find("mox.com", Mid(Value, 4)))
            ),
            Value,
            Char(10)
          ),
          ""
        )

    - kind: SendActivity
      id: dbg_moxguard
      activity: "MOX GUARD DEMOTED: {Topic.MoxDemoted}"

    - kind: SetVariable
      id: set_tier_ordered
      variable: Topic.TierOrdered
      value: |-
        =IfError(
          Concat(
            Filter(
              Split(
                Concat(
                  Filter(Split(Topic.TierGuarded, Char(10)), StartsWith(Value, "MOX")),
                  Value,
                  Char(10)
                ) & Char(10) &
                Concat(
                  Filter(Split(Topic.TierGuarded, Char(10)), StartsWith(Value, "STAKEHOLDER")),
                  Value,
                  Char(10)
                ) & Char(10) &
                Concat(
                  Filter(Split(Topic.TierGuarded, Char(10)), StartsWith(Value, "INDUSTRY")),
                  Value,
                  Char(10)
                ) & Char(10) &
                Concat(
                  Filter(
                    Split(Topic.TierGuarded, Char(10)),
                    !StartsWith(Value, "MOX") And !StartsWith(Value, "STAKEHOLDER") And !StartsWith(Value, "INDUSTRY")
                  ),
                  Value,
                  Char(10)
                ),
                Char(10)
              ),
              !IsBlank(Trim(Value))
            ),
            Value,
            Char(10)
          ),
          Topic.TierGuarded
        )

    - kind: SetVariable
      id: set_formatted
      variable: Topic.Formatted
      value: |-
        =IfError(
          Concat(
            ForAll(
              Filter(
                Split(Topic.TierOrdered, Char(10)),
                !IsBlank(Trim(ThisRecord.Value))
              ),
              If(
                CountRows(Split(ThisRecord.Value, "|")) < 4 Or IsBlank(Find("::", Trim(Last(Split(ThisRecord.Value, "|")).Value))),
                "- " & Trim(ThisRecord.Value),
                "- **" & Trim(First(Split(ThisRecord.Value, "|")).Value) & "**  "
                & "["
                & Substitute(
                    Substitute(
                      Trim(
                        Concat(
                          FirstN(
                            LastN(Split(ThisRecord.Value, "|"), CountRows(Split(ThisRecord.Value, "|")) - 1),
                            CountRows(Split(ThisRecord.Value, "|")) - 3
                          ),
                          Value,
                          "|"
                        )
                      ),
                      "[", "("),
                    "]", ")")
                & "]("
                & Trim(Mid(First(Split(Trim(Last(Split(ThisRecord.Value, "|")).Value), " ;; ")).Value, Find("::", First(Split(Trim(Last(Split(ThisRecord.Value, "|")).Value), " ;; ")).Value) + 2))
                & ")"
                & "  -  " & Trim(Last(FirstN(Split(ThisRecord.Value, "|"), CountRows(Split(ThisRecord.Value, "|")) - 1)).Value)
                & "  -  "
                & Concat(
                    Split(Trim(Last(Split(ThisRecord.Value, "|")).Value), " ;; "),
                    "[" & Trim(First(Split(ThisRecord.Value, "::")).Value) & "](" & Trim(Mid(ThisRecord.Value, Find("::", ThisRecord.Value) + 2)) & ")",
                    ", "
                  )
              )
            ),
            Value,
            Char(10)
          ),
          Topic.TierOrdered
        )

    - kind: SendActivity
      id: dbg_runend
      activity: RUN END {IfError(Text(Now(), "yyyy-mm-dd hh:mm:ss"), "NA")}

    - kind: SendActivity
      id: send_result
      activity: "{Topic.Formatted}"

inputType: {}
outputType: {}