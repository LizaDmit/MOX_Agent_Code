          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: SendActivity
      id: dbg_p4a2
      activity: P4A2 START raw={Len(Topic.g4a2)} slim={Len(Topic.g4a2slim)}

    - kind: SendActivity
      id: dbg_p4a2_dump
      activity: "P4A2 SLIM HEAD: {Substitute(Substitute(Left(Topic.g4a2slim, 1500), \"<\", \"[\"), \">\", \"]\")}"

    - kind: InvokeAIBuilderModelAction
      id: parse_g4a2
      input:
        binding:
          response: =Topic.g4a2slim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4a2Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: SendActivity
      id: dbg_p4a2_done
      activity: P4A2 OK in={CountRows(Split(Topic.g4a2slim, "<item>")) - 1} out={CountRows(Split(Topic.G4a2Parsed.text, Char(10)))} chars={Len(Topic.G4a2Parsed.text)}

    - kind: InvokeAIBuilderModelAction
      id: classify_g4a2
      input:
        binding:
          result: =Topic.G4a2Parsed.text

      output:
        binding:
          predictionOutput: Topic.C4a2

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: dbg_c4a2_done
      activity: "C4A2 OK: {Topic.C4a2.text}"

    - kind: HttpRequestAction
      id: http_g4a4
      url: https://news.google.com/rss/search?q=site%3Arthk.hk%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4a4
      responseSchema: String

    - kind: SetVariable
      id: set_g4a4_slim
      variable: Topic.g4a4slim
      value: |-
        =First(Split(Topic.g4a4, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4a4, "<description>"),
            CountRows(Split(Topic.g4a4, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: SendActivity
      id: dbg_p4a4
      activity: P4A4 START raw={Len(Topic.g4a4)} slim={Len(Topic.g4a4slim)}

    - kind: InvokeAIBuilderModelAction
      id: parse_g4a4
      input:
        binding:
          response: =Topic.g4a4slim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4a4Parsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: SendActivity
      id: dbg_p4a4_done
      activity: P4A4 OK in={CountRows(Split(Topic.g4a4slim, "<item>")) - 1} out={CountRows(Split(Topic.G4a4Parsed.text, Char(10)))} chars={Len(Topic.G4a4Parsed.text)}

    - kind: InvokeAIBuilderModelAction
      id: classify_g4a4
      input:
        binding:
          result: =Topic.G4a4Parsed.text

      output:
        binding:
          predictionOutput: Topic.C4a4

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: dbg_c4a4_done
      activity: "C4A4 OK: {Topic.C4a4.text}"

    - kind: HttpRequestAction
      id: http_g4b
      url: https://news.google.com/rss/search?q=site%3Atvb.com%20OR%20site%3Awenweipo.com%20OR%20site%3Aam730.com.hk%20OR%20site%3Ahkcd.com.hk%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4b
      responseSchema: String

    - kind: SetVariable
      id: set_g4b_slim
      variable: Topic.g4bslim
      value: |-
        =First(Split(Topic.g4b, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4b, "<description>"),
            CountRows(Split(Topic.g4b, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: SendActivity
      id: dbg_p4b
      activity: P4B START raw={Len(Topic.g4b)} slim={Len(Topic.g4bslim)}

    - kind: InvokeAIBuilderModelAction
      id: parse_g4b
      input:
        binding:
          response: =Topic.g4bslim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
          predictionOutput: Topic.G4bParsed

      aIModelId: 906ed583-6e73-4704-bbb9-41a86807a784

    - kind: SendActivity
      id: dbg_p4b_done
      activity: P4B OK in={CountRows(Split(Topic.g4bslim, "<item>")) - 1} out={CountRows(Split(Topic.G4bParsed.text, Char(10)))} chars={Len(Topic.G4bParsed.text)}

    - kind: InvokeAIBuilderModelAction
      id: classify_g4b
      input:
        binding:
          result: =Topic.G4bParsed.text

      output:
        binding:
          predictionOutput: Topic.C4b

      aIModelId: 4ac27a1e-7c9a-4c41-a301-e28f5f9d1d5e

    - kind: SendActivity
      id: dbg_c4b_done
      activity: "C4B OK: {Topic.C4b.text}"

    - kind: HttpRequestAction
      id: http_g4c
      url: https://news.google.com/rss/search?q=site%3Aaastocks.com%20OR%20site%3Anow.com%20OR%20site%3Aquamnet.com%20OR%20site%3Athestandard.com.hk%20when%3A2d&hl=zh-HK&gl=HK&ceid=HK:zh-Hant
      response: Topic.g4c
      responseSchema: String

    - kind: SetVariable
      id: set_g4c_slim
      variable: Topic.g4cslim
      value: |-
        =First(Split(Topic.g4c, "<description>")).Value &
        Concat(
          LastN(
            Split(Topic.g4c, "<description>"),
            CountRows(Split(Topic.g4c, "<description>")) - 1
          ),
          Last(Split(ThisRecord.Value, "</description>")).Value,
          ""
        )

    - kind: SendActivity
      id: dbg_p4c
      activity: P4C START raw={Len(Topic.g4c)} slim={Len(Topic.g4cslim)}

    - kind: InvokeAIBuilderModelAction
      id: parse_g4c
      input:
        binding:
          response: =Topic.g4cslim
          windowend: =Topic.WindowEnd
          windowstart_20: =Topic.WindowStart

      output:
        binding:
